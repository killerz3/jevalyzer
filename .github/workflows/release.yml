name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: jevalyzer-linux-x64
          - target: bun-linux-arm64
            asset: jevalyzer-linux-arm64
          - target: bun-darwin-arm64
            asset: jevalyzer-macos-arm64
          - target: bun-darwin-x64
            asset: jevalyzer-macos-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun build --compile --minify --target=${{ matrix.target }} src/cli.ts --outfile ${{ matrix.asset }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true

  npm:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test
      # Not on npm yet, so this is allowed to fail until NPM_TOKEN exists and
      # the first version has been published by hand. The binaries above are
      # the release; this step only adds the registry copy.
      - run: npm publish --provenance --access public
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
